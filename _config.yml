title: "Portfolio – Soro Kinignari Zakaria"
description: "Data Analyst | Python • SQL • Power BI • Machine Learning"
logo: "assets/img/soro1.jpg"
favicon: "assets/img/favicon.ico"

# Thème
theme: jekyll-theme-minimal

# Paramètres généraux
lang: fr
timezone: "Africa/Abidjan"

# Auteur
author:
  name: "Soro Kinignari Zakaria"
  email: "sorokinignari@gmail.com"
  role: "Data Analyst"
  bio: "Transforming data into insights to drive strategic decisions."
  social:
    linkedin: "https://www.linkedin.com/in/kinignari-zakaria-soro-652789212"
    github: "https://github.com/sparozak"

# Navigation
navigation:
  - title: "Accueil"
    url: /
  - title: "Projets"
    url: /projects
  - title: "Compétences"
    url: /skills
  - title: "Certifications"
    url: /certifications
  - title: "À propos"
    url: /about
  - title: "Contact"
    url: /contact

# Layout configuration (pour thèmes modernes)
layout:
  default:
    sidebar: true
    hero: true
    dark_mode: true

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# SEO
seo:
  meta_description: "Portfolio professionnel de Soro Kinignari Zakaria, Data Analyst spécialisé en Python, SQL, Machine Learning et Data Visualization."
  og_image: "assets/img/og-image.jpg"
  twitter_card: summary_large_image

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-include-cache

# Style & Assets
sass:
  style: compressed

assets_dir: "assets"
include:
  - "assets"

# Liens sociaux affichés sur le site
social_links:
  - name: "LinkedIn"
    icon: "fab fa-linkedin"
    url: "https://www.linkedin.com/in/kinignari-zakaria-soro-652789212"
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/sparozak"

# Options diverses
show_downloads: false
